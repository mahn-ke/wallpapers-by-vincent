#http
services:
  app:
    image: ghcr.io/mahn-ke/wallpapers-by-vincent:latest@sha256:5dce2a1e6ed48ef76bea429660a0a66ea804e13ddb30d23dbf8819823ec0fc4c
    restart: on-failure:5
    environment:
      - APP_ACCESS_TOKEN=${APP_ACCESS_TOKEN}
      - IMMICH_ALBUM_ID=${IMMICH_ALBUM_ID}
      - IMMICH_API_KEY=${IMMICH_API_KEY}
      - IMMICH_BASE_URL=${IMMICH_BASE_URL}
    ports:
      - "3010:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
