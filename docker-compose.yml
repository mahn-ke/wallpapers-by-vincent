#http
services:
  app:
    image: ghcr.io/mahn-ke/wallpapers-by-vincent:latest@sha256:8fa9eea677a2f18e626d57b8f04c1b9f46fc53a4a9cf1afc657236d99e1f7c9f
    restart: on-failure:5
    environment:
      - APP_ACCESS_TOKEN=${APP_ACCESS_TOKEN}
      - IMMICH_ALBUM_ID=${IMMICH_ALBUM_ID}
      - IMMICH_API_KEY=${IMMICH_API_KEY}
      - IMMICH_BASE_URL=${IMMICH_BASE_URL}
    ports:
      - "3010:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
