#http
services:
  app:
    image: ghcr.io/mahn-ke/wallpapers-by-vincent:latest@sha256:91bfbdb09b2da87a66d6321fc89688779871701a9e5fa94806e12aef9546a236
    restart: on-failure:5
    environment:
      - APP_ACCESS_TOKEN=${APP_ACCESS_TOKEN}
      - IMMICH_ALBUM_ID=${IMMICH_ALBUM_ID}
      - IMMICH_API_KEY=${IMMICH_API_KEY}
      - IMMICH_BASE_URL=${IMMICH_BASE_URL}
    ports:
      - "3010:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
